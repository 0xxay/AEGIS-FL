[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fl"
version = "2.5.0"
description = "AEGIS-FL (PPFL-IDS): Privacy-Preserving Federated Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "opacus>=1.4.0",
    "phe>=1.5.0",
]

[project.optional-dependencies]
local = [
    "streamlit>=1.30.0",
    "flwr>=1.7.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
include = ["src*", "app*"]
