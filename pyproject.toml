[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fl"
version = "2.5.0"
description = "AEGIS-FL (PPFL-IDS): Privacy-Preserving Federated Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "flwr>=1.7.0",
    "opacus>=1.4.0",
    "streamlit>=1.30.0",
    "phe>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
