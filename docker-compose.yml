services:
  federated-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisfl_server
    command: python -m src.federated_runner --dataset unsw --rounds 3 --defense norm_clipping
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    networks:
      - fednet

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisfl_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - federated-server
    networks:
      - fednet

networks:
  fednet:
    driver: bridge
