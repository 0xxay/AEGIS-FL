services:
  federated-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_grpc_server
    command: python -m src.flower_federation --role server --address 0.0.0.0:9092 --dataset unsw --model resnet --defense multi_krum --rounds 3 --min_clients 5
    ports:
      - "9092:9092"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    networks:
      - fednet

  client-bank:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_client_bank
    command: python -m src.flower_federation --role client --address federated-server:9092 --client_id 0 --dataset unsw --model resnet
    volumes:
      - ./data/processed/unsw:/app/data/processed/unsw:ro
      - ./data/clients/unsw/client_0.npz:/app/data/clients/unsw/client_0.npz:ro
    depends_on:
      - federated-server
    networks:
      - fednet

  client-hospital:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_client_hospital
    command: python -m src.flower_federation --role client --address federated-server:9092 --client_id 1 --dataset unsw --model resnet
    volumes:
      - ./data/processed/unsw:/app/data/processed/unsw:ro
      - ./data/clients/unsw/client_1.npz:/app/data/clients/unsw/client_1.npz:ro
    depends_on:
      - federated-server
    networks:
      - fednet

  client-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_client_enterprise
    command: python -m src.flower_federation --role client --address federated-server:9092 --client_id 2 --dataset unsw --model resnet
    volumes:
      - ./data/processed/unsw:/app/data/processed/unsw:ro
      - ./data/clients/unsw/client_2.npz:/app/data/clients/unsw/client_2.npz:ro
    depends_on:
      - federated-server
    networks:
      - fednet

  client-government:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_client_gov
    command: python -m src.flower_federation --role client --address federated-server:9092 --client_id 3 --dataset unsw --model resnet
    volumes:
      - ./data/processed/unsw:/app/data/processed/unsw:ro
      - ./data/clients/unsw/client_3.npz:/app/data/clients/unsw/client_3.npz:ro
    depends_on:
      - federated-server
    networks:
      - fednet

  client-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_client_cloud
    command: python -m src.flower_federation --role client --address federated-server:9092 --client_id 4 --dataset unsw --model resnet
    volumes:
      - ./data/processed/unsw:/app/data/processed/unsw:ro
      - ./data/clients/unsw/client_4.npz:/app/data/clients/unsw/client_4.npz:ro
    depends_on:
      - federated-server
    networks:
      - fednet

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qelvari_dashboard_multinode
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - federated-server
    networks:
      - fednet

networks:
  fednet:
    driver: bridge
